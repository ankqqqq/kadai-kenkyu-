<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>自転車事故危険度マップ</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<style>

body {
  margin: 0;
  font-family: sans-serif;
  overflow: hidden;
}

#map {
  height: 100vh;
  width: 100vw;
}

.panel {

  position: absolute;
  top: 10px;
  left: 10px;

  z-index: 9999;

  width: 280px;

  background: rgba(20,20,30,0.9);
  color: white;

  padding: 14px;

  border-radius: 14px;

  box-shadow: 0 4px 20px rgba(0,0,0,0.3);

  line-height: 1.7;
}

.panel h2 {
  margin: 0 0 10px 0;
  font-size: 18px;
}

#risk {
  font-size: 28px;
  font-weight: bold;
}

button {

  margin-top: 10px;

  width: 100%;

  border: none;
  border-radius: 8px;

  padding: 10px;

  background: #2563eb;
  color: white;

  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.small {
  font-size: 12px;
  opacity: 0.8;
}

</style>
</head>

<body>

<div class="panel">

  <h2>🚲 通学用事故危険度</h2>

  危険度:
  <span id="risk">--</span>

  <br><br>

  現在地:
  <div id="pos">取得中...</div>

  <br>

  速度:
  <span id="speed">--</span>

  <br>

  進行方向:
  <span id="heading">--</span>

  <button onclick="recalc()">
    危険度を再計算
  </button>

  <div class="small">
    赤=一般事故<br>
    橙=交差点事故<br>
    紫=夜間事故<br>
    青=転倒事故
  </div>

</div>

<div id="map"></div>

<script>

// ======================================================
// 🗺️ MAP
// ======================================================

const map = L.map('map').setView([38.26, 140.87], 13);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: "© OpenStreetMap"
  }
).addTo(map);

// ======================================================
// 📦 DATA
// ======================================================

let accidentData = [];

let clusterLayer = L.markerClusterGroup();

map.addLayer(clusterLayer);

let heatLayer = null;

// ======================================================
// 📡 USER
// ======================================================

let userLat = null;
let userLon = null;

let userMarker = null;

let initialized = false;

let currentSpeed = 0;
let currentHeading = 0;

// ======================================================
// 🧹 CLEAN
// ======================================================

function clean(s) {
  return (s ?? "")
    .replace(/\u3000/g, " ")
    .trim();
}

// ======================================================
// 📥 LOAD CSV
// ======================================================

async function loadCSV() {

  try {

    const res = await fetch("jikoopendata.csv");

    const text = await res.text();

    accidentData = parseCSV(text);

    drawAccidents();

    updateUI();

  } catch(err) {

    console.error(err);

    alert("CSV読み込み失敗");
  }
}

// ======================================================
// 🔄 CSV PARSE
// ======================================================

function parseCSV(csvText) {

  const parsed = Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true
  });

  return parsed.data
    .map((row, i) => {

      const party1 = clean(
        row["当事者1"] ||
        row["当事者種別1"] ||
        ""
      );

      const party2 = clean(
        row["当事者2"] ||
        row["当事者種別2"] ||
        ""
      );

      const isBike =
        party1.includes("自転車") ||
        party2.includes("自転車") ||
        party1.includes("軽車両") ||
        party2.includes("軽車両");

      if (!isBike) return null;

      const lat = parseFloat(
        row["緯度"] ||
        row["lat"] ||
        row["latitude"]
      );

      const lon = parseFloat(
        row["経度"] ||
        row["lon"] ||
        row["longitude"]
      );

      if (isNaN(lat) || isNaN(lon)) return null;

      return {

        id: i,

        lat,
        lon,

        hour: Number(
          row["時間"] || 0
        ),

        type: mapType(
          clean(row["事故類型"] || ""),
          clean(row["昼夜"] || "")
        ),

        meta: {
          date: row["発生日"] || "",
          party1,
          party2
        }
      };

    })
    .filter(Boolean);
}

// ======================================================
// 🚨 TYPE
// ======================================================

function mapType(type, daytime) {

  if (
    daytime.includes("夜")
  ) {
    return "night_accident";
  }

  if (
    type.includes("交差点")
  ) {
    return "intersection";
  }

  if (
    type.includes("単独") ||
    type.includes("転倒")
  ) {
    return "bike_fall";
  }

  return "car_bike";
}

// ======================================================
// 🎨 DRAW
// ======================================================

function drawAccidents() {

  clusterLayer.clearLayers();

  const heatData = [];

  accidentData.forEach(a => {

    let color = "red";

    if (a.type === "intersection") {
      color = "orange";
    }

    if (a.type === "night_accident") {
      color = "purple";
    }

    if (a.type === "bike_fall") {
      color = "blue";
    }

    const marker = L.circleMarker(
      [a.lat, a.lon],
      {
        radius: 5,
        color,
        fillOpacity: 0.7
      }
    );

    marker.bindPopup(`
      <b>${a.type}</b><br>
      ${a.meta.date}<br>
      ${a.meta.party1}<br>
      ${a.meta.party2}
    `);

    clusterLayer.addLayer(marker);

    heatData.push([
      a.lat,
      a.lon,
      0.8
    ]);
  });

  if (heatLayer) {
    map.removeLayer(heatLayer);
  }

  heatLayer = L.heatLayer(
    heatData,
    {
      radius: 28,
      blur: 18,
      maxZoom: 17
    }
  ).addTo(map);
}

// ======================================================
// 📏 DISTANCE (HAVERSINE)
// ======================================================

function distance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const toRad = d =>
    d * Math.PI / 180;

  const dLat = toRad(lat2 - lat1);

  const dLon = toRad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );
}

// ======================================================
// 🧭 HEADING TEXT
// ======================================================

function headingToText(deg) {

  if (deg == null) return "--";

  const dirs = [
    "北",
    "北東",
    "東",
    "南東",
    "南",
    "南西",
    "西",
    "北西"
  ];

  return dirs[
    Math.round(deg / 45) % 8
  ];
}

// ======================================================
// ⚠️ RISK
// ======================================================

function calcRisk() {

  if (userLat == null) {
    return 0;
  }

  let score = 0;

  const nowHour =
    new Date().getHours();

  accidentData.forEach(a => {

    const d = distance(
      userLat,
      userLon,
      a.lat,
      a.lon
    );

    if (d > 600) return;

    // 距離減衰
    score += 500 / (d + 50);

    // 交差点
    if (a.type === "intersection") {
      score += 8;
    }

    // 夜間
    if (
      a.type === "night_accident" &&
      (nowHour >= 18 || nowHour <= 5)
    ) {
      score += 15;
    }

    // 転倒
    if (a.type === "bike_fall") {
      score += 5;
    }

    // 進行方向先読み
    if (currentSpeed > 2) {

      const headingBonus =
        1.2;

      score *= headingBonus;
    }

  });

  return Math.min(
    Math.round(score),
    100
  );
}

// ======================================================
// 🎨 UI
// ======================================================

function updateUI() {

  const risk =
    calcRisk();

  const el =
    document.getElementById("risk");

  el.innerText = risk;

  if (risk < 30) {
    el.style.color = "#22c55e";
  }
  else if (risk < 60) {
    el.style.color = "#facc15";
  }
  else {
    el.style.color = "#ef4444";
  }

  document.getElementById("speed")
    .innerText =
    currentSpeed.toFixed(1) + " m/s";

  document.getElementById("heading")
    .innerText =
    headingToText(currentHeading);
}

// ======================================================
// 🔄 RECALC
// ======================================================

function recalc() {
  updateUI();
}

// ======================================================
// 📡 GPS
// ======================================================
 
// グローバル変数
let userLat = null;
let userLon = null;

let userMarker = null;

let initialized = false;

let currentSpeed = 0;
let currentHeading = 0;

let accuracyCircle = null;

// GPS開始
function startGPS() {

  // GPS対応チェック
  if (!navigator.geolocation) {

    alert("このブラウザはGPS未対応です");

    return;
  }

  // 読み込み表示
  document.getElementById("pos").innerHTML =
    "GPS取得中...";

  // GPS監視開始
  navigator.geolocation.watchPosition(

    // ==================================================
    // ✅ SUCCESS
    // ==================================================
    pos => {

      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;

      currentSpeed =
        pos.coords.speed || 0;

      currentHeading =
        pos.coords.heading || 0;

      const accuracy =
        pos.coords.accuracy || 0;

      // ==============================
      // UI更新
      // ==============================
      document.getElementById("pos").innerHTML =
        `
        緯度: ${userLat.toFixed(5)}<br>
        経度: ${userLon.toFixed(5)}<br>
        精度: ${Math.round(accuracy)}m
        `;

      // ==============================
      // USER MARKER
      // ==============================
      if (!userMarker) {

        userMarker = L.marker(
          [userLat, userLon],
          {
            title: "現在地"
          }
        ).addTo(map);

      } else {

        userMarker.setLatLng(
          [userLat, userLon]
        );
      }

      // ==============================
      // 精度円
      // ==============================
      if (!accuracyCircle) {

        accuracyCircle = L.circle(
          [userLat, userLon],
          {
            radius: accuracy,
            color: "#3b82f6",
            fillColor: "#60a5fa",
            fillOpacity: 0.15,
            weight: 1
          }
        ).addTo(map);

      } else {

        accuracyCircle.setLatLng(
          [userLat, userLon]
        );

        accuracyCircle.setRadius(
          accuracy
        );
      }

      // ==============================
      // 初回だけ移動
      // ==============================
      if (!initialized) {

        map.setView(
          [userLat, userLon],
          16
        );

        initialized = true;
      }

      // ==============================
      // 危険度更新
      // ==============================
      updateUI();
    },

    // ==================================================
    // ❌ ERROR
    // ==================================================
    err => {

      console.error(err);

      let message = "";

      switch(err.code) {

        case err.PERMISSION_DENIED:

          message =
            "位置情報が拒否されました";

          break;

        case err.POSITION_UNAVAILABLE:

          message =
            "GPS位置を取得できません";

          break;

        case err.TIMEOUT:

          message =
            "GPS取得タイムアウト";

          break;

        default:

          message =
            "GPSエラー";
      }

      document.getElementById("pos")
        .innerHTML =
        `<span style="color:red">${message}</span>`;
    },

    // ==================================================
    // ⚙️ OPTIONS
    // ==================================================
    {
      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 2000
    }
  );
}
    // =========================
    // ⚙️ OPTIONS
    // =========================
    {
      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0
    }
  );
}

// ======================================================
// 🚀 START
// ======================================================

loadCSV();

startGPS();

</script>

</body>
</html>
